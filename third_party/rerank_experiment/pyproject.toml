[project]
name = "rerank-experiments"
version = "0.1.0"
description = "PAS V3.1 Cosmos/CR3 Nano reranker evaluator"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "transformers>=4.40,<6",
    "sentencepiece>=0.1.99",
    "tokenizers>=0.15",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# CR3 Nano VLM scoring requires vLLM and the current Transformers line.
vlm = [
    "vllm==0.23.0",
    "transformers>=5.5.1,<6",
    "qwen-vl-utils==0.0.14",
    "decord==0.6.0",
    "accelerate>=0.30",
    "einops>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rerank_experiments"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
